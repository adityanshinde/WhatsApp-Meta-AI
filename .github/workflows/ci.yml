name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & dev tools
        run: pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Run pytest suite
        run: pytest -v tests/test_api.py
      - name: Build wheel & verify clean install
        run: |
          python -m build
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install dist/*.whl pytest
          /tmp/clean-venv/bin/wa-meta-ai --help
          /tmp/clean-venv/bin/pytest -v tests/test_api.py
