[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-meta-ai"
version = "0.1.5"
description = "Open-source REST API, Python SDK, CLI, and MCP server for WhatsApp Meta AI image generation & media extraction"
readme = "README.md"
authors = [{ name = "Aditya Shinde" }]
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "whatsapp",
    "meta-ai",
    "whatsapp-web",
    "image-generation",
    "image-to-image",
    "playwright",
    "fastapi",
    "mcp",
    "ai-agents",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "playwright>=1.45.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0"]

[project.scripts]
wa-meta-ai = "wa_meta_ai.cli:main"

[project.urls]
Homepage = "https://github.com/adityanshinde/WhatsApp-Meta-AI"
Repository = "https://github.com/adityanshinde/WhatsApp-Meta-AI"
Issues = "https://github.com/adityanshinde/WhatsApp-Meta-AI/issues"

[tool.setuptools.packages.find]
where = ["src"]
