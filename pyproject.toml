[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-meta-ai"
version = "0.1.0"
description = "Open-source REST API, Python SDK, and CLI for WhatsApp Meta AI image generation & extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.45.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
wa-meta-ai = "wa_meta_ai.cli:main"

[project.urls]
Homepage = "https://github.com/adityanshinde/WhatsApp-Meta-AI"
Repository = "https://github.com/adityanshinde/WhatsApp-Meta-AI"
Issues = "https://github.com/adityanshinde/WhatsApp-Meta-AI/issues"

[tool.setuptools.packages.find]
where = ["src"]
